name: idi
runtime: python
description: Bootstrap IAM resources for GitHub Actions OIDC authentication

config:
  aws:region:
    description: AWS region to deploy to
    value: us-east-2

  idi:github_org:
    description: GitHub organization name
    value: "dsi-clinic"

  idi:app_name:
    description: Name of the application
    value: "ftm2j-shared"

  # idi:repos, idi:checks_sub_conditions, and idi:deploy_sub_conditions are
  # intentionally NOT declared here. Their canonical defaults live in
  # infra/config.py (repos: a code list; the sub conditions: derived per stack so
  # each env's roles trust only environment:{stack}). Declaring a key in this
  # block with no value makes it a *required* stack config and breaks `pulumi
  # preview` when the stack file doesn't set it. Each can still be overridden per
  # stack via `pulumi config set --path idi:<key>[0] ...` if ever needed.

