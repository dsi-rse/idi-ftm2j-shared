name: idi
runtime: python
description: Bootstrap IAM resources for GitHub Actions OIDC authentication

config:
  aws:region:
    description: AWS region to deploy to
    value: us-east-2

  idi:github_org:
    description: GitHub organization name
    value: "dsi-clinic"

  idi:app_name:
    description: Name of the application
    value: "ftm2j-shared"

  idi:repos:
    description: >
      Repositories that each get their own isolated checks + deploy OIDC role
      pair. Defaults to the four idi repos in code when not set; add a repo here
      (or to the code default) and re-deploy to provision its roles.

  idi:checks_sub_conditions:
    description: >
      Ref/environment patterns that may assume each repo's checks role. Each entry
      is appended to "repo:{github_org}/{repo}:" to form the full sub condition.
      Defaults to pull_request + any branch + dev/prod environments when not set.

  idi:deploy_sub_conditions:
    description: >
      Ref/environment patterns that may assume each repo's deploy role. Each entry
      is appended to "repo:{github_org}/{repo}:" to form the full sub condition.
      Defaults to main/dev/release branches + dev/prod environments when not set.

