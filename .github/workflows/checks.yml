# PR quality gate for this repo. Thin caller of the shared pipeline-checks.yml
# composition (lint, test, security, pulumi preview), referenced locally (./).
#
# One standardized trigger set: PRs targeting main or dev. The old
# release/release**/issue-* targets are dropped — issue branches still get checks
# because their PRs target dev (the trigger keys on the base branch, not source).
name: Checks

on:
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/pipeline-checks.yml
    secrets: inherit
    with:
      app-name: ftm2j-shared
      # The importable package (underscore form). The old workflow also passed
      # `idi_ftm2j_shared_infra`, which matches no importable module (the pulumi
      # infra lives in pulumi-shared/infra, imported as `infra`) — it measured
      # nothing, so it's dropped rather than carried over.
      cov-package: "idi_ftm2j_shared"
      pulumi-dir: pulumi-shared
