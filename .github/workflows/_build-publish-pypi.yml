# Reusable workflow: build the distribution, publish to PyPI, attach to the
# GitHub Release. The PyPI shape — used by this repo only.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token, just id-token
# permission and a GitHub environment. The dist is built once and reused by both
# the PyPI publish and the release-asset upload.
name: _build-publish-pypi

on:
  workflow_call:
    inputs:
      version:
        description: Version/tag to attach release assets to (the v-prefixed tag).
        type: string
        required: true
      python-version:
        type: string
        default: "3.13"
      pypi-environment:
        description: GitHub environment guarding the PyPI publish.
        type: string
        default: "release"
      project-url:
        description: Project URL shown on the environment deployment.
        type: string
        default: ""

jobs:
  build-dist:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: ${{ inputs.python-version }}

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-dist]
    environment:
      name: ${{ inputs.pypi-environment }}
      url: ${{ inputs.project-url }}
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  upload-release-assets:
    name: Upload artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-dist]
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Attach artifacts to GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          tag: v${{ inputs.version }}
          artifacts: "dist/*"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
