# Reusable workflow: build & push image(s) to GHCR.
#
# Each image gets the run's version tag plus a moving `latest`. GITHUB_TOKEN
# auto-provides GHCR auth.
name: _docker-build

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      version:
        description: Tag to publish (the version computed by _version).
        type: string
        required: true
      images:
        description: >
          JSON array of images to build, e.g.
          '[{"name":"orchestrator","dockerfile":"dockerfiles/Dockerfile.orchestrator"}]'.
        type: string
        required: true
      project-dir:
        description: Docker build context.
        type: string
        default: "."
      registry:
        type: string
        default: "ghcr.io"
      image-prefix:
        type: string
        default: "idi"

jobs:
  docker:
    name: Build & push ${{ matrix.image.name }} to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-prefix }}-${{ inputs.app-name }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.project-dir }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
