# Post-merge pipeline for this repo (the shared PyPI package + shared infra).
#
#   changes ─► version ─┬─► build-dist ─► publish            (src changed, main only)
#           │           │             └─► upload-release-assets
#           │           └─► sync-dev                          (main only: merge main->dev)
#           └─► deploy-pulumi                                 (pulumi-shared changed)
#
# SELF-CONTAINED ON PURPOSE. This used to be a thin caller of a reusable
# workflow (pipeline-pypi.yml), but PyPI Trusted Publishing matches the
# configured workflow filename against the OIDC `job_workflow_ref` claim, which
# for a reusable workflow is the *called* file, not deploy.yml — and PyPI does
# not officially support reusable workflows for trusted publishing ("subject to
# breakage"). Inlining keeps `job_workflow_ref` == deploy.yml so the existing
# PyPI publisher config keeps working, with no reusable-workflow fragility.
#
# Unlike pipeline-docker.yml / pipeline-checks.yml (shared cross-repo by
# processors), this flow is repo-local only — see docs/onboarding-a-processor.md.
name: Deploy

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      github: ${{ steps.filter.outputs.github }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            src:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            pulumi:
              - 'pulumi-shared/**'
            github:
              - '.github/**'
      - name: Resolve deploy environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Version, tag & release
    needs: changes
    # Bump on package OR shared-workflow changes, so every change to the
    # reusable workflows produces a new immutable tag siblings can pin.
    if: >
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.github == 'true')
      && github.event.head_commit.committer.name != 'idi-deploy-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Configure Git identity
        run: |
          git config user.name "idi-deploy-bot"
          git config user.email "idi-deploy-bot@users.noreply.github.com"
      - name: Compute version
        id: set-version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            uv version --bump patch
            VERSION=$(uv version --short)
          else
            BASE=$(uv version --bump patch --dry-run --short)
            VERSION="${BASE}a${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit version bump (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git add pyproject.toml uv.lock 2>/dev/null || true
          git diff --staged --quiet || \
            (git commit -m "chore: bump version to ${{ steps.set-version.outputs.version }}" && git push)
      - name: Push tag
        run: |
          git tag -a "v${{ steps.set-version.outputs.version }}" -m "Version ${{ steps.set-version.outputs.version }}"
          git push origin "v${{ steps.set-version.outputs.version }}"
      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          generateReleaseNotes: true
          name: v${{ steps.set-version.outputs.version }}
          tag: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}

  build-dist:
    name: Build distribution
    needs: [changes, version]
    # Publish only when the package itself changed — a CI-only version bump
    # tags/releases but must not publish an unchanged package to PyPI.
    if: needs.changes.outputs.src == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Build the tagged/bumped commit, NOT github.sha. The `version` job
          # commits the bump *after* the triggering commit, so github.sha still
          # holds the previous version string — building it stamps new code with
          # the old version (PyPI ends up one release behind the GitHub tag).
          # The tag is pushed by `version` before this job starts (needs edge).
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: "3.13"
      - name: Build
        run: uv build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/idi-ftm2j-shared/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # Keep reasonably current: this action bundles twine, and a stale pin
        # rejects wheels whose Metadata-Version is newer than its packaging
        # knows about (v0.1.17 failed this way once hatchling emitted 2.5).
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26  # v1.14.2

  upload-release-assets:
    name: Upload artifacts to GitHub Release
    needs: [version, build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Attach artifacts to GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          tag: v${{ needs.version.outputs.version }}
          artifacts: "dist/*"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  sync-dev:
    name: Sync stable version to dev
    needs: version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Merge main into dev
        run: |
          git config user.name "idi-deploy-bot"
          git config user.email "idi-deploy-bot@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B dev origin/dev
          git merge --ff-only origin/main || \
            git merge --no-ff origin/main \
              -m "Merge main into dev (stable v${{ needs.version.outputs.version }})"
          git push origin dev

  deploy-pulumi:
    name: Deploy Pulumi (${{ needs.changes.outputs.deploy_env }})
    needs: changes
    # Independent of the version bump (infra can change without a release).
    if: >
      needs.changes.outputs.pulumi == 'true'
      && (needs.changes.outputs.deploy_env != 'prod' || vars.PROD_INFRA_READY == 'true')
      && github.event.head_commit.committer.name != 'idi-deploy-bot'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --group pulumi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure Pulumi
        working-directory: pulumi-shared
        run: |
          pulumi login s3://${{ vars.PULUMI_STATE_BUCKET }}
          pulumi stack select ${{ needs.changes.outputs.deploy_env }} 2>/dev/null || pulumi stack init ${{ needs.changes.outputs.deploy_env }}
          pulumi config set aws:region ${{ env.AWS_REGION }}
          pulumi config set idi:app_name ftm2j-shared
      - name: Pulumi deploy
        working-directory: pulumi-shared
        run: uv run pulumi up --yes
