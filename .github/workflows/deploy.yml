# Post-merge pipeline for this repo (the shared PyPI package + shared infra).
#
# Thin caller: all logic lives in the reusable composition pipeline-pypi.yml,
# referenced locally (./) since it's in this same repo. The composition runs:
#   changes -> version -> {build-publish (main only), sync-dev (main)} and
#   changes -> deploy-pulumi (when pulumi-shared/** changed).
#
# pipeline-pypi.yml carries this repo's defaults (app-name=ftm2j-shared,
# pulumi-dir=pulumi-shared, PyPI URL), so no `with:` block is needed here.
name: Deploy

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted at the caller so the nested reusable jobs can request their subsets —
# a called workflow can never exceed the caller's permissions, and `{}` (all
# none) makes even _changes' `contents: read` invalid.
permissions:
  contents: write   # version bump commit, tag + GitHub release, sync-dev
  id-token: write   # OIDC: AWS (pulumi deploy) + PyPI trusted publishing

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline-pypi.yml
    secrets: inherit
