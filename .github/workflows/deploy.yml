# Post-merge pipeline: detect changes, version, release, deploy, and publish.
# Validation (lint, tests, security, pulumi preview) runs in checks.yml before merge.
#
# Versioning:
#   - dev:  alpha version computed for the run only (NOT committed). This keeps dev
#           from re-triggering itself.
#   - main: real stable bump committed to main, then merged back into dev so dev
#           reflects the released version.
#
# Deploy-loop prevention (why we do NOT use [skip ci]):
#   The bump commit (main) and the sync-back commit (dev) are committed as
#   "ftm2j-deploy-bot". The version + deploy-pulumi jobs skip whenever the run's
#   head commit was committed by that bot, which breaks the deploy->commit->deploy
#   cycle. We deliberately avoid [skip ci] because it (a) suppresses ALL workflows
#   for the commit — including the required PR checks in checks.yml, which silently
#   leaves dev->main PRs BLOCKED — and (b) matches the literal string anywhere in a
#   commit message, so an accidental mention disables CI. The committer-identity
#   guard is scoped to this workflow only and is deterministic.
#
# Job DAG:
#   changes ──┬──► version ──┬──► build-dist ──► publish   (src/** changed, main only)
#             │              └──► sync-dev               (main only: merge main->dev)
#             └──► deploy-pulumi                          (only if pulumi-shared/** changed)
#
# Note: This deploys the shared infrastructure for all FTM2J processor stacks.
#
name: Deploy

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: .
  APP_NAME: ftm2j-shared

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      pulumi: ${{ steps.filter.outputs.pulumi }}
      src: ${{ steps.filter.outputs.src }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            pulumi:
              - 'pulumi-shared/**'
            src:
              - 'src/**'
              - 'pyproject.toml'
      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=dev" >> $GITHUB_OUTPUT
          fi

  version:
    name: Version, Tag & Release
    runs-on: ubuntu-latest
    needs: [changes]
    # Skip when this run was triggered by the deploy bot's own bump/sync commit
    # (loop prevention). 'ftm2j-deploy-bot' must match the git identity set in the
    # commit/merge steps below. See the header comment for why this isn't [skip ci].
    if: >
      needs.changes.outputs.src == 'true'
      && github.event.head_commit.committer.name != 'ftm2j-deploy-bot'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    outputs:
      version: ${{ steps.output.outputs.version }}
      pulumi_project: ${{ steps.output.outputs.pulumi_project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group deploy

      - name: Compute version
        id: set-version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # Alpha versions exist only for this run — never committed to dev.
            # Base = next stable (patch bump), computed without writing pyproject.toml.
            # Append the run number (orderable) and short SHA (traceable). Use a '-'
            # separator (not the PEP 440 '+' local segment) so the version is safe to
            # reuse downstream as an AWS resource/ECR-image tag.
            BASE=$(uv version --bump patch --dry-run --short)
            VERSION="${BASE}a${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          else
            # main: real stable bump, written to pyproject.toml and committed below.
            # (--bump stable would be a no-op now that alphas are never committed.)
            uv version --bump patch
            VERSION=$(uv version --short)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit stable version bump (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          # Commit as the deploy bot so the resulting push to main is recognised by
          # the version/deploy-pulumi `if:` guards and does NOT re-trigger Deploy
          # (identity-based loop prevention instead of [skip ci]; see header comment).
          git config user.name "ftm2j-deploy-bot"
          git config user.email "ftm2j-deploy-bot@users.noreply.github.com"
          git add pyproject.toml uv.lock 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: bump version to ${{ steps.set-version.outputs.version }}" && git push)

      - name: Push tag
        run: |
          git tag -a "v${{ steps.set-version.outputs.version }}" -m "Version ${{ steps.set-version.outputs.version }}"
          git push origin "v${{ steps.set-version.outputs.version }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          generateReleaseNotes: true
          name: v${{ steps.set-version.outputs.version }}
          tag: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.ref == 'refs/heads/dev' }}

      - name: Save outputs
        id: output
        run: |
          echo "version=${{ steps.set-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          PULUMI_PROJECT=$(grep '^name:' pulumi-shared/Pulumi.yaml | awk '{print $2}')
          echo "pulumi_project=$PULUMI_PROJECT" >> "$GITHUB_OUTPUT"

  sync-dev:
    name: Sync stable version to dev
    runs-on: ubuntu-latest
    needs: [version]
    # After a prod release, fast-forward dev with the new stable version so dev's
    # pyproject.toml reflects it. Direct push (no PR) — requires DEPLOY_KEY to have
    # push access to dev (allow-list it in dev's branch protection).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Merge main into dev
        run: |
          # Commit as the deploy bot so the push to dev is recognised by the
          # version/deploy-pulumi `if:` guards and does NOT re-trigger Deploy on dev.
          git config user.name "ftm2j-deploy-bot"
          git config user.email "ftm2j-deploy-bot@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B dev origin/dev
          # Prefer a fast-forward: when dev hasn't diverged, it just advances to
          # main's bump commit (already authored by the deploy bot) — no merge bubble.
          # Only when new commits landed on dev mid-release do we create a merge
          # commit; it's committed by the deploy bot too, so the guards still skip it.
          git merge --ff-only origin/main || \
            git merge --no-ff origin/main \
              -m "Merge main into dev (stable v${{ needs.version.outputs.version }})"
          git push origin dev

  deploy-pulumi:
    name: Deploy Pulumi
    runs-on: ubuntu-latest
    needs: [changes]
    # The committer check skips the deploy bot's own bump/sync commits (loop
    # prevention) — needed here too because a sync merge into dev can carry
    # pulumi-shared changes. See the header comment for why this isn't [skip ci].
    if: >
      (needs.changes.outputs.pulumi == 'true'
      && (needs.changes.outputs.deploy_env == 'dev' || vars.PROD_INFRA_READY == 'true')
      && github.event.head_commit.committer.name != 'ftm2j-deploy-bot')
      || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/pulumi-shared
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      DLQ_RETENTION_DAYS: ${{ secrets.DLQ_RETENTION_DAYS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"
          python-version: "3.13"

      - name: Install Pulumi dependencies
        run: |
          cd ${{ github.workspace }}/${{ env.PROJECT_DIR }} && uv sync --group pulumi --group deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Configure Pulumi
        run: |
          pulumi login s3://${{ secrets.PULUMI_STATE_BUCKET }}
          pulumi stack select ${{ needs.changes.outputs.deploy_env }} 2>/dev/null || pulumi stack init ${{ needs.changes.outputs.deploy_env }}
          pulumi config set aws:region ${{ secrets.AWS_REGION || 'us-east-2' }}
          pulumi config set idi:app_name ${{ env.APP_NAME }}
          [ -n "$BUCKET_NAME" ] && pulumi config set idi:bucket_name "$BUCKET_NAME"
          [ -n "$DLQ_RETENTION_DAYS" ] && pulumi config set idi:dlq_retention_days "$DLQ_RETENTION_DAYS"

      - name: Pulumi deploy
        run: uv run pulumi up --yes

  build-dist:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [version, changes]
    if: needs.changes.outputs.src == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: "3.13"

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-dist]
    environment:
      name: release
      url: https://pypi.org/project/idi-ftm2j-shared/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  upload-release-assets:
    name: Upload artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-dist]
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Attach artifacts to GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          tag: v${{ needs.version.outputs.version }}
          artifacts: "dist/*"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
