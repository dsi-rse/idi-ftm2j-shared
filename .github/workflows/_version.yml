# Reusable workflow: version, tag & release — the #24 versioning model.
#
#   - dev:  the version is computed FOR THE RUN ONLY and never committed. Base is
#           the next patch (computed with --dry-run so pyproject.toml is not
#           written), with the run number (orderable) and short SHA (traceable)
#           appended using a '-' separator — NOT the PEP 440 '+local' segment —
#           so the string is safe to reuse as an ECR/Docker image tag.
#   - main: a real patch bump, written to pyproject.toml and committed.
#
# Loop prevention is a committer-identity guard, NOT `[skip ci]`: `[skip ci]`
# suppresses ALL workflows including the required PR checks (silently leaving
# dev->main PRs BLOCKED) and matches the literal string anywhere in a message.
# The bump/tag commits are authored by `idi-deploy-bot`; the guard below skips
# the run whenever its head commit was authored by that identity. The bot name
# MUST be byte-identical here, in `_sync-dev.yml`, and in every composition's
# `if:` guard, or loop prevention breaks.
name: _version

on:
  workflow_call:
    inputs:
      project-dir:
        description: Directory containing pyproject.toml.
        type: string
        default: "."
      python-version:
        type: string
        default: "3.13"
      pulumi-project-file:
        description: Path to the Pulumi.yaml whose `name:` is exported as pulumi_project.
        type: string
        default: "pulumi/Pulumi.yaml"
      bot-name:
        description: Committer identity used for bump/tag commits and the loop guard.
        type: string
        default: "idi-deploy-bot"
      bot-email:
        type: string
        default: "idi-deploy-bot@users.noreply.github.com"
    secrets:
      DEPLOY_KEY:
        description: SSH deploy key with push access, used to push the bump commit + tag.
        required: true
    outputs:
      version:
        description: The computed version for this run.
        value: ${{ jobs.version.outputs.version }}
      deploy_env:
        description: Target environment (prod on main, else dev).
        value: ${{ jobs.version.outputs.deploy_env }}
      pulumi_project:
        description: Pulumi project name read from the project file.
        value: ${{ jobs.version.outputs.pulumi_project }}

jobs:
  version:
    name: Version, tag & release
    runs-on: ubuntu-latest
    # Loop prevention: skip the run the bot's own bump/sync commit triggered.
    # head_commit is null for workflow_dispatch, so the comparison is true there
    # and the job still runs. Keep this identical to the composition guards.
    if: github.event.head_commit.committer.name != inputs.bot-name
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      deploy_env: ${{ steps.output.outputs.deploy_env }}
      pulumi_project: ${{ steps.output.outputs.pulumi_project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        # `uv version` only needs the project metadata, not a specific group.
        # Bare sync avoids assuming a `deploy` group that siblings don't define.
        run: uv sync

      - name: Configure Git identity
        run: |
          # Committing as the bot is what the loop-prevention guards key on.
          git config user.name "${{ inputs.bot-name }}"
          git config user.email "${{ inputs.bot-email }}"

      - name: Compute version
        id: set-version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main: real patch bump, written to pyproject.toml and committed below.
            uv version --bump patch
            VERSION=$(uv version --short)
          else
            # dev (and any other branch): computed for this run only, never
            # committed. Base = next patch without writing the file; append run
            # number + short SHA with a '-' separator so it is tag-safe.
            BASE=$(uv version --bump patch --dry-run --short)
            VERSION="${BASE}a${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git add pyproject.toml uv.lock 2>/dev/null || true
          git diff --staged --quiet || \
            (git commit -m "chore: bump version to ${{ steps.set-version.outputs.version }}" && git push)

      - name: Push tag
        run: |
          git tag -a "v${{ steps.set-version.outputs.version }}" -m "Version ${{ steps.set-version.outputs.version }}"
          git push origin "v${{ steps.set-version.outputs.version }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          generateReleaseNotes: true
          name: v${{ steps.set-version.outputs.version }}
          tag: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}

      - name: Save outputs
        id: output
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
          fi
          PULUMI_PROJECT=$(grep '^name:' "${{ inputs.pulumi-project-file }}" | awk '{print $2}')
          echo "pulumi_project=$PULUMI_PROJECT" >> "$GITHUB_OUTPUT"
