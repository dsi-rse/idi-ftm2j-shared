# Release the shared CI contract: advance the `ci-v1` moving tag.
#
# Consumers (this repo's own callers and the sibling repos) pin the reusable
# workflows and the composite action at `@ci-v1`. This workflow keeps that tag
# pointing at the latest commit whenever the shared CI files change, so a
# non-breaking workflow/action edit reaches every consumer with no manual "cut"
# step and no per-consumer bump.
#
# It runs IN PARALLEL with the package release (Deploy / pipeline-pypi.yml): both
# fire on the same push to main, but this one is gated — via native
# `on.push.paths` — to only the shared CI files, independent of the package
# version. The `vX.Y.Z` stable version still tracks the Python package; `ci-v1`
# tracks the CI contract.
#
# Breaking changes to the shared workflows: bump to `ci-v2` by hand (update the
# in-repo `@ci-v1` references and tell consumers), the same way actions/checkout
# moves v4 forward but cuts v5 for breaks.
#
# Bootstrap: the first push to main that touches these paths CREATES `ci-v1`.
# That must land before the host dogfoods (issue .13) or any sibling migrates,
# since their pipelines resolve `@ci-v1`.
name: Release CI workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

concurrency:
  group: release-ci
  cancel-in-progress: false

permissions: {}

jobs:
  retag:
    name: Advance ci-v1
    runs-on: ubuntu-latest
    # The deploy bot's bump commit only touches pyproject/uv.lock (never .github),
    # so it won't trigger this workflow — but guard anyway, mirroring the other
    # loop-prevention guards.
    if: github.event.head_commit.committer.name != 'idi-deploy-bot'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Advance ci-v1 tag to this commit
        run: |
          git config user.name "idi-deploy-bot"
          git config user.email "idi-deploy-bot@users.noreply.github.com"
          # Force-move (creates it the first time) the moving major tag.
          git tag -f -a "ci-v1" -m "Shared CI workflows @ ${GITHUB_SHA::7}"
          git push -f origin "ci-v1"
