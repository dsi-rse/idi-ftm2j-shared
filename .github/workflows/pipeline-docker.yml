# Composition: post-merge pipeline for the Docker processors (the 3 siblings).
#
#   version ─┬─► docker ─► deploy-pulumi ─► sync-ecr
#            └─► sync-dev                  (main only: merge main->dev)
#
# deploy-pulumi runs BEFORE sync-ecr: deploy-pulumi creates the ECR repository,
# so on a fresh environment the repo must exist before sync-ecr can push to it.
# This leaves a gap — the ECS task def points at an image tag that sync-ecr only
# pushes afterward — but the processors are cron-scheduled and pull lazily, so a
# deploy lands the new tag before the next scheduled run. Accepting that gap is
# what makes deploying to a brand-new environment work without manual bootstrap.
#
# No per-filter change detection: the chain is LINEAR (each link consumes the
# prior — docker builds, deploy-pulumi provisions, sync-ecr pushes), so gating
# individual links on path filters would break it — a code-only change would
# build an image that never deploys; an infra-only change couldn't deploy. The
# full chain runs on every non-doc push; doc-only pushes are excluded by the
# caller's `paths-ignore` at the trigger. deploy_env comes from the version job.
#
# SELF-CONTAINED ON PURPOSE: every job is inline (no `uses: ./...` nested
# reusables). A reusable workflow's relative `./` refs resolve against the
# *calling* repo, so a sibling calling this cross-repo can't find them — the
# whole graph must live in this one file. (pipeline-checks is inline for the
# same reason.)
#
# Each sibling's thin `deploy.yml` calls this with `secrets: inherit`, passing
# only `app-name` and `images`. Loop prevention: the `version` job is guarded on
# the committer identity (literal `idi-deploy-bot`), so the chain skips on the
# deploy bot's own bump/sync commits.
#
# Prod is gated on PROD_INFRA_READY: a main push still versions, releases, and
# pushes the image to GHCR, but deploy-pulumi (and the ECR sync) is skipped until
# the processor flips its var to 'true'.
name: pipeline-docker

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      images:
        description: >
          JSON array of {name, dockerfile}, e.g.
          '[{"name":"orchestrator","dockerfile":"dockerfiles/Dockerfile.orchestrator"}]'.
        type: string
        required: true
      project-dir:
        type: string
        default: "."
      pulumi-dir:
        type: string
        default: "pulumi"
      image-prefix:
        type: string
        default: "idi"
      python-version:
        type: string
        default: "3.13"
      registry:
        type: string
        default: "ghcr.io"
      bot-name:
        type: string
        default: "idi-deploy-bot"
      bot-email:
        type: string
        default: "idi-deploy-bot@users.noreply.github.com"
    secrets:
      # AWS_ROLE_ARN_DEPLOY is environment-scoped — not declared here; the
      # deploy-pulumi and sync-ecr jobs resolve it via their `environment:`.
      DEPLOY_KEY:
        required: true
      PULUMI_CONFIG_PASSPHRASE:
        required: true

jobs:
  version:
    name: Version, tag & release
    # Full chain on every non-doc push (doc-only filtered by the caller's
    # paths-ignore); skip only the deploy bot's own bump/sync commits.
    if: github.event.head_commit.committer.name != inputs.bot-name
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      pulumi_project: ${{ steps.output.outputs.pulumi_project }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Configure Git identity
        run: |
          git config user.name "${{ inputs.bot-name }}"
          git config user.email "${{ inputs.bot-email }}"
      - name: Compute version
        id: set-version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            uv version --bump patch
            VERSION=$(uv version --short)
          else
            BASE=$(uv version --bump patch --dry-run --short)
            VERSION="${BASE}a${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit version bump (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git add pyproject.toml uv.lock 2>/dev/null || true
          git diff --staged --quiet || \
            (git commit -m "chore: bump version to ${{ steps.set-version.outputs.version }}" && git push)
      - name: Push tag
        run: |
          git tag -a "v${{ steps.set-version.outputs.version }}" -m "Version ${{ steps.set-version.outputs.version }}"
          git push origin "v${{ steps.set-version.outputs.version }}"
      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          generateReleaseNotes: true
          name: v${{ steps.set-version.outputs.version }}
          tag: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
      - name: Resolve deploy environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Save outputs
        id: output
        run: |
          PULUMI_PROJECT=$(grep '^name:' "${{ inputs.pulumi-dir }}/Pulumi.yaml" | awk '{print $2}')
          echo "pulumi_project=$PULUMI_PROJECT" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push ${{ matrix.image.name }} to GHCR
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-prefix }}-${{ inputs.app-name }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.project-dir }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sync-dev:
    name: Sync stable version to dev
    needs: version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Merge main into dev
        run: |
          git config user.name "${{ inputs.bot-name }}"
          git config user.email "${{ inputs.bot-email }}"
          git fetch origin main dev
          git checkout -B dev origin/dev
          git merge --ff-only origin/main || \
            git merge --no-ff origin/main \
              -m "Merge main into dev (stable v${{ needs.version.outputs.version }})"
          git push origin dev

  deploy-pulumi:
    name: Deploy Pulumi (${{ needs.version.outputs.deploy_env }})
    needs: [version, docker]
    # Always on dev; on prod only once the processor marks its infra ready.
    if: needs.version.outputs.deploy_env != 'prod' || vars.PROD_INFRA_READY == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "0.11.8"
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: uv sync --group pulumi
        working-directory: ${{ inputs.project-dir }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure Pulumi
        working-directory: ${{ inputs.project-dir }}/${{ inputs.pulumi-dir }}
        run: |
          pulumi login s3://${{ vars.PULUMI_STATE_BUCKET }}
          pulumi stack select ${{ needs.version.outputs.deploy_env }} 2>/dev/null || pulumi stack init ${{ needs.version.outputs.deploy_env }}
          pulumi config set aws:region ${{ env.AWS_REGION }}
          pulumi config set idi:app_name ${{ inputs.app-name }}
      - name: Pulumi deploy
        working-directory: ${{ inputs.project-dir }}/${{ inputs.pulumi-dir }}
        run: uv run pulumi up --yes

  # ECR sync runs AFTER deploy-pulumi: deploy-pulumi creates the ECR repository,
  # so the repo must exist before we can push to it (the chicken-and-egg that
  # makes fresh-environment bootstrap work). The skip on prod-not-ready is
  # inherited transitively — a skipped deploy-pulumi skips its dependants — so no
  # separate PROD_INFRA_READY guard is needed here.
  sync-ecr:
    name: Sync ${{ matrix.image.name }} to ECR (${{ needs.version.outputs.deploy_env }})
    needs: [version, docker, deploy-pulumi]
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
      packages: read
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag and push to ECR
        env:
          ECR_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || format('{0}-{1}', needs.version.outputs.pulumi_project, needs.version.outputs.deploy_env) }}
        run: |
          ECR_REPO="${ECR_PREFIX}-${{ inputs.app-name }}-${{ matrix.image.name }}"
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/$ECR_REPO"
          GHCR_IMG="${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-prefix }}-${{ inputs.app-name }}-${{ matrix.image.name }}"
          docker pull "${GHCR_IMG}:${{ needs.version.outputs.version }}"
          docker tag "${GHCR_IMG}:${{ needs.version.outputs.version }}" "${ECR_URI}:${{ needs.version.outputs.version }}"
          docker tag "${GHCR_IMG}:${{ needs.version.outputs.version }}" "${ECR_URI}:latest"
          docker push "${ECR_URI}:${{ needs.version.outputs.version }}"
          docker push "${ECR_URI}:latest"
