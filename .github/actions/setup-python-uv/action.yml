# Composite action: install a pinned uv + Python, then optionally `uv sync`.
#
# Standardizes the uv toolchain across every repo. The host repo pinned uv to
# 0.11.8 while all three siblings used "latest"; pinning one version here removes
# that drift and keeps CI reproducible.
#
# IMPORTANT: a local `uses: ./.github/actions/...` reference inside a reusable
# workflow resolves against the CALLER's checkout, not this repo — so the
# siblings (whose checkouts don't contain this action) would fail to find it.
# The reusable workflows therefore reference this action by its full pinned path
# (dsi-clinic/idi-ftm2j-shared/.github/actions/setup-python-uv@ci-v1), which
# always resolves to this repo regardless of who called the workflow.
name: Setup Python + uv
description: Install a pinned uv and Python, then optionally sync dependencies.

inputs:
  python-version:
    description: Python version for uv to provision.
    default: "3.13"
  uv-version:
    description: uv version to pin (single source of truth for the toolchain).
    default: "0.11.8"
  sync-args:
    description: >
      Arguments passed to `uv sync` (e.g. "--group deploy" or
      "--all-extras --all-groups"). Leave empty to install the toolchain only
      and skip the sync.
    default: ""
  working-directory:
    description: Directory to run `uv sync` in.
    default: "."

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      if: inputs.sync-args != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.sync-args }}
